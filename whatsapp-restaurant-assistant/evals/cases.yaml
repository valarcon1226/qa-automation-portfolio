  # Category 2: Menú y Precios (5 cases)
  # ============================================================================
  - id: "eval_06"
    categoria: "menu"
    pregunta: "¿Cuánto cuesta la Bandeja Paisa y qué ingredientes trae?"
    herramienta_esperada: "get_menu"
    hechos_esperados:
      - "34.000"
      - "chicharron"
      - "Bandeja Paisa"
    cosas_prohibidas:
      - "gratis"
      - "50.000"
      - "20.000"

  - id: "eval_07"
    categoria: "menu"
    pregunta: "¿Qué opciones de entradas tienen disponibles en el menú?"
