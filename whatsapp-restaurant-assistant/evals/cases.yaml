      - "Arepa de Choclo"
      - "Patacones"
    cosas_prohibidas:
      - "pizza"
      - "tacos"
      - "hamburguesa"

  - id: "eval_08"
    categoria: "menu"
    pregunta: "¿Cuánto vale la Limonada de Coco y qué ingredientes lleva?"
