cases:
  # ============================================================================
  # Category 1: Reservas (5 cases)
  # ============================================================================
  - id: "eval_01"
    categoria: "reservas"
    pregunta: "¿Puedo reservar una mesa para 4 personas este viernes a las 7:00 pm?"
    herramienta_esperada: "create_reservation"
    argumentos_esperados:
      party_size: 4
      time: "19:00"
    hechos_esperados:
      - "reserva"
      - "4"
    cosas_prohibidas:
      - "cerrado"
      - "error fatal"

  - id: "eval_02"
    categoria: "reservas"
    pregunta: "Quisiera reservar para 2 personas el sábado a la 1:00 pm para almorzar."
    herramienta_esperada: "create_reservation"
    argumentos_esperados:
      party_size: 2
      time: "13:00"
    hechos_esperados:
      - "reserva"
      - "2"
    cosas_prohibidas:
      - "cerrado"

  - id: "eval_03"
    categoria: "rechazo_politica"
    pregunta: "Hola, quiero reservar una mesa para 6 personas este lunes a las 2:00 pm."
    herramienta_esperada: null
    hechos_esperados:
      - "lunes"
      - "cerrado"
    cosas_prohibidas:
      - "reserva confirmada"
      - "con gusto te esperamos el lunes"

  - id: "eval_04"
    categoria: "rechazo_politica"
    pregunta: "Necesito una mesa para 20 personas este sábado para celebrar un cumpleaños."
    herramienta_esperada: "register_event_lead"
    hechos_esperados:
      - "12 personas"
      - "evento"
    cosas_prohibidas:
      - "reserva confirmada para 20"

  - id: "eval_05"
    categoria: "rechazo_politica"
    pregunta: "Quiero una mesa para hoy a las 11:00 de la noche para cenar."
    herramienta_esperada: null
    hechos_esperados:
      - "horario"
      - "9:00"
    cosas_prohibidas:
      - "reserva confirmada"

